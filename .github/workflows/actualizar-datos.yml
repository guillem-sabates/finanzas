name: Actualizar datos

on:
  schedule:
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos reales de Yahoo Finance
        run: python fetch_datos.py

      - name: Guardar datos.js si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.js
          git diff --staged --quiet || git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push
